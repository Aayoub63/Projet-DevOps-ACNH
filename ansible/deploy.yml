---
- name: Déploiement du TP noté sur la VM
  hosts: vm_tpnote
  become: yes

  tasks:
    # 1. Installation de Docker
    - name: Mise à jour du cache apt
      apt:
        update_cache: yes
        cache_valid_time: 3600   # pas de mise à jour si le cache a moins d'une heure

    - name: Installation de Docker
      apt:
        name: docker.io
        state: present

    - name: Installation de Docker Compose (via apt)
      apt:
        name: docker-compose
        state: present

    - name: Démarrage de Docker
      systemd:
        name: docker
        state: started
        enabled: yes

    # 2. Création du dossier de déploiement
    - name: Création du dossier de déploiement
      file:
        path: /opt/tpnote
        state: directory
        mode: '0755'

    # 3. Création du fichier acme.json
    # On ne touche le fichier que s'il n'existe pas, sinon "touch" le marque modifié à chaque passage
    - name: Création du fichier acme.json avec bonnes permissions
      file:
        path: /opt/tpnote/acme.json
        state: touch
        mode: '0600'
        modification_time: preserve
        access_time: preserve

    # 3.5 Création des dossiers de provisioning Grafana (Méthode GitOps)
    - name: Création des dossiers de provisioning Grafana
      file:
        path: "/opt/tpnote/grafana/provisioning/{{ item }}"
        state: directory
        mode: '0755'
      loop:
        - datasources
        - dashboards

    # 4. Nettoyage des anciens dossiers sources inutiles (Dette technique)
    - name: Nettoyer les anciens dossiers sources
      file:
        path: "/opt/tpnote/{{ item }}"
        state: absent
      loop:
        - backend
        - frontend

    # 5. Copie des fichiers de configuration
    # Si un fichier change, on redémarre seulement le service concerné (handlers en bas)
    - name: Copie de traefik.yaml
      template:
        src: templates/traefik.yaml.j2
        dest: /opt/tpnote/traefik.yaml
        mode: '0644'
      notify: Redémarrer traefik

    - name: Copie de la configuration Prometheus
      template:
        src: templates/prometheus.yml.j2
        dest: /opt/tpnote/prometheus.yml
        mode: '0644'
      notify: Redémarrer prometheus

    - name: Copie du provisioning Datasource Grafana
      template:
        src: templates/grafana-datasources.yml.j2
        dest: /opt/tpnote/grafana/provisioning/datasources/prometheus.yml
        mode: '0644'
      notify: Redémarrer grafana

    - name: Copie du provisioning Dashboards Grafana
      template:
        src: templates/grafana-dashboards.yml.j2
        dest: /opt/tpnote/grafana/provisioning/dashboards/default.yml
        mode: '0644'
      notify: Redémarrer grafana

    - name: Copie du dashboard Grafana de l'application
      copy:
        src: files/grafana/acnh-dashboard.json
        dest: /opt/tpnote/grafana/provisioning/dashboards/acnh-dashboard.json
        mode: '0644'

    - name: Copie de docker-compose.yml
      template:
        src: templates/docker-compose.yml.j2
        dest: /opt/tpnote/docker-compose.yml
        mode: '0644'

    # Les secrets vont dans un .env lisible uniquement par root
    - name: Création du fichier .env (secrets)
      template:
        src: templates/env.j2
        dest: /opt/tpnote/.env
        mode: '0600'
      no_log: true

    # 6. Images Docker
    # Connexion au registre GitLab pour pouvoir télécharger les images
    - name: Connexion au registre Docker GitLab
      shell: echo "{{ registry_token }}" | docker login registry.edu.forestier.re -u {{ registry_user }} --password-stdin
      changed_when: false
      no_log: true

    - name: Téléchargement des images de l'application
      command: docker pull registry.edu.forestier.re/{{ project_namespace }}/{{ item }}:{{ app_version }}
      loop:
        - backend
        - frontend
      register: pull
      changed_when: "'Downloaded newer image' in pull.stdout"

    # 7. Lancement du stack Docker
    # docker-compose ne recrée que les conteneurs dont l'image ou la config a changé.
    # On n'arrête plus tous les conteneurs à chaque déploiement.
    - name: Lancement du stack Docker
      command: docker-compose up -d --remove-orphans
      args:
        chdir: /opt/tpnote
      register: compose_up
      changed_when: compose_up.stderr is search('Creating|Recreating|Starting|Removing')

    # 8. Vérification : on attend que le healthcheck du backend passe à "healthy"
    # Si ce n'est pas le cas au bout de 3 minutes, le job de déploiement échoue.
    - name: Attente du backend en bonne santé
      shell: docker inspect --format '{% raw %}{{.State.Health.Status}}{% endraw %}' $(docker-compose ps -q backend)
      args:
        chdir: /opt/tpnote
      register: backend_health
      until: backend_health.stdout == "healthy"
      retries: 18
      delay: 10
      changed_when: false

    - name: Attente du frontend en bonne santé
      shell: docker inspect --format '{% raw %}{{.State.Health.Status}}{% endraw %}' $(docker-compose ps -q frontend)
      args:
        chdir: /opt/tpnote
      register: frontend_health
      until: frontend_health.stdout == "healthy"
      retries: 12
      delay: 10
      changed_when: false

  handlers:
    - name: Redémarrer traefik
      command: docker-compose restart traefik
      args:
        chdir: /opt/tpnote

    - name: Redémarrer prometheus
      command: docker-compose restart prometheus
      args:
        chdir: /opt/tpnote

    - name: Redémarrer grafana
      command: docker-compose restart grafana
      args:
        chdir: /opt/tpnote
