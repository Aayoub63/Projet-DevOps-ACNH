---
- name: Déploiement d'ACNHCollector sur la VM
  hosts: vm_acnh
  become: yes

  vars:
    deploy_dir: /opt/acnh
    registry: registry.edu.forestier.re

  tasks:
    - name: Mise à jour du cache apt
      apt:
        update_cache: yes
        cache_valid_time: 3600   # pas de mise à jour si le cache a moins d'une heure

    - name: Installation de Docker
      apt:
        name: docker.io
        state: present

    - name: Installation de Docker Compose
      apt:
        name: docker-compose
        state: present

    - name: Démarrage de Docker
      systemd:
        name: docker
        state: started
        enabled: yes

    - name: Création du dossier de déploiement
      file:
        path: "{{ deploy_dir }}"
        state: directory
        mode: '0755'

    # Traefik refuse un acme.json lisible par d'autres utilisateurs, d'où les droits 600.
    # Les dates sont conservées pour que la tâche ne signale pas un changement à chaque passage.
    - name: Création du fichier acme.json (certificats Let's Encrypt)
      file:
        path: "{{ deploy_dir }}/acme.json"
        state: touch
        mode: '0600'
        modification_time: preserve
        access_time: preserve

    - name: Création des dossiers de provisioning Grafana
      file:
        path: "{{ deploy_dir }}/grafana/provisioning/{{ item }}"
        state: directory
        mode: '0755'
      loop:
        - datasources
        - dashboards

    # Une configuration modifiée redémarre uniquement le service concerné (voir les handlers).
    - name: Copie de la configuration Traefik
      template:
        src: templates/traefik.yaml.j2
        dest: "{{ deploy_dir }}/traefik.yaml"
        mode: '0644'
      notify: Redémarrer traefik

    - name: Copie de la configuration Prometheus
      template:
        src: templates/prometheus.yml.j2
        dest: "{{ deploy_dir }}/prometheus.yml"
        mode: '0644'
      notify: Redémarrer prometheus

    - name: Copie de la source de données Grafana
      template:
        src: templates/grafana-datasources.yml.j2
        dest: "{{ deploy_dir }}/grafana/provisioning/datasources/prometheus.yml"
        mode: '0644'
      notify: Redémarrer grafana

    - name: Copie de la configuration des dashboards Grafana
      template:
        src: templates/grafana-dashboards.yml.j2
        dest: "{{ deploy_dir }}/grafana/provisioning/dashboards/default.yml"
        mode: '0644'
      notify: Redémarrer grafana

    # Grafana relit ce dossier toutes les 30 secondes : pas besoin de redémarrage.
    - name: Copie du dashboard de l'application
      copy:
        src: files/grafana/acnh-dashboard.json
        dest: "{{ deploy_dir }}/grafana/provisioning/dashboards/acnh-dashboard.json"
        mode: '0644'

    - name: Copie de docker-compose.yml
      template:
        src: templates/docker-compose.yml.j2
        dest: "{{ deploy_dir }}/docker-compose.yml"
        mode: '0644'

    # Les secrets sont lus par docker-compose dans ce fichier, lisible par root uniquement.
    - name: Création du fichier .env des secrets
      template:
        src: templates/env.j2
        dest: "{{ deploy_dir }}/.env"
        mode: '0600'
      no_log: true

    - name: Connexion au registre d'images
      shell: echo "{{ registry_token }}" | docker login {{ registry }} -u {{ registry_user }} --password-stdin
      changed_when: false
      no_log: true

    - name: Téléchargement des images de l'application
      command: docker pull {{ registry }}/{{ project_namespace }}/{{ item }}:{{ app_version }}
      loop:
        - backend
        - frontend
      register: image_pull
      changed_when: "'Downloaded newer image' in image_pull.stdout"

    # docker-compose ne recrée que les conteneurs dont l'image ou la configuration a changé.
    - name: Lancement des conteneurs
      command: docker-compose up -d --remove-orphans
      args:
        chdir: "{{ deploy_dir }}"
      register: compose_up
      changed_when: compose_up.stderr is search('Creating|Recreating|Starting|Removing')

    # Le déploiement échoue si le backend n'est pas healthy au bout de 3 minutes (18 essais de 10 s).
    - name: Attente du backend en bonne santé
      shell: docker inspect --format '{% raw %}{{.State.Health.Status}}{% endraw %}' $(docker-compose ps -q backend)
      args:
        chdir: "{{ deploy_dir }}"
      register: backend_health
      until: backend_health.stdout == "healthy"
      retries: 18
      delay: 10
      changed_when: false

    - name: Attente du frontend en bonne santé
      shell: docker inspect --format '{% raw %}{{.State.Health.Status}}{% endraw %}' $(docker-compose ps -q frontend)
      args:
        chdir: "{{ deploy_dir }}"
      register: frontend_health
      until: frontend_health.stdout == "healthy"
      retries: 12
      delay: 10
      changed_when: false

  handlers:
    - name: Redémarrer traefik
      command: docker-compose restart traefik
      args:
        chdir: "{{ deploy_dir }}"

    - name: Redémarrer prometheus
      command: docker-compose restart prometheus
      args:
        chdir: "{{ deploy_dir }}"

    - name: Redémarrer grafana
      command: docker-compose restart grafana
      args:
        chdir: "{{ deploy_dir }}"
