image: registry.edu.forestier.re/infrastructure/images/docker:v1.0.0

stages:
  - test
  - build
  - deploy
  - verify

variables:
  DOCKER_BUILDKIT: "1"
  REGISTRY: registry.edu.forestier.re
  BACKEND_IMAGE: $REGISTRY/$CI_PROJECT_NAMESPACE/backend
  FRONTEND_IMAGE: $REGISTRY/$CI_PROJECT_NAMESPACE/frontend
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"


# Tests du backend (JUnit 5, Mockito, base H2 en mémoire).
# Un test en échec arrête le pipeline : aucune image n'est construite ni déployée.
test_backend:
  stage: test
  image: maven:3.8.6-openjdk-8-slim
  cache:
    key: maven
    paths:
      - .m2/repository
  script:
    - cd app/backend
    - mvn -B test
    # GitLab lit la couverture dans la sortie du job avec l'expression du mot-clé coverage.
    - |
      awk -F, 'NR>1 {m+=$4; c+=$5} END {printf "Couverture instructions : %.1f%%\n", 100*c/(m+c)}' target/site/jacoco/jacoco.csv
  coverage: '/Couverture instructions : (\d+\.\d+)%/'
  artifacts:
    when: always
    reports:
      junit: app/backend/target/surefire-reports/TEST-*.xml
    paths:
      - app/backend/target/site/jacoco/
    expire_in: 7 days


# Vérifie la syntaxe de l'infrastructure sans toucher au cloud (pas de backend, pas de plan).
validate_tofu:
  stage: test
  image:
    name: ghcr.io/opentofu/opentofu:1.11.5
    # L'image lance tofu par défaut ; GitLab a besoin d'un shell pour exécuter le script.
    entrypoint: [""]
  script:
    - cd tofu
    - tofu init -backend=false
    - tofu validate

validate_ansible:
  stage: test
  image: registry.edu.forestier.re/infrastructure/images/ansible:v1.0.0
  script:
    - cd ansible
    - ansible-playbook --syntax-check deploy.yml



# Partie commune aux deux builds : récupération du jeton et connexion au registre.
.build_push_template:
  stage: build
  before_script:
    # Les secrets viennent d'OpenBao et ne sont jamais affichés dans les logs.
    # jq -e échoue si la clé manque, ce qui évite de continuer avec un secret vide.
    # On n'écrit pas "export X=$(...)" : le code retour d'export masquerait l'échec de jq.
    - get_secrets.sh > /tmp/secrets.json
    # Installe jq uniquement si l'image ne le fournit pas (Alpine ou Debian).
    - command -v jq >/dev/null || apk add --no-cache jq >/dev/null || (apt-get update -qq && apt-get install -y -qq jq)
    - REGISTRY_TOKEN=$(jq -er 'first(.. | .REGISTRY_TOKEN? // empty)' /tmp/secrets.json)
    - echo "$REGISTRY_TOKEN" | docker login -u $CI_REGISTRY_USER --password-stdin $REGISTRY
  # Mêmes déclencheurs que deploy_app : chaque déploiement doit trouver
  # dans le registre l'image construite pour son commit.
  only:
    - main
    - develop
    - tags

build_backend:
  extends: .build_push_template
  script:
    - cd app/backend
    # L'image est étiquetée avec le SHA du commit : on sait exactement quel code tourne,
    # et le déploiement réutilise la même étiquette. "latest" ne permettrait pas de le savoir.
    - docker build -t $BACKEND_IMAGE:$CI_COMMIT_SHA .
    - docker push $BACKEND_IMAGE:$CI_COMMIT_SHA

build_frontend:
  extends: .build_push_template
  script:
    - cd app/frontend
    # L'URL de l'API est figée dans le bundle Vue au moment du build.
    - docker build --build-arg VUE_APP_API="https://api.${USER_ID_UCA}.uca-devops.ovh/" -t $FRONTEND_IMAGE:$CI_COMMIT_SHA .
    - docker push $FRONTEND_IMAGE:$CI_COMMIT_SHA

# Déploiement sur la VM avec Ansible. Les secrets sont passés en variables (-e)
# et Ansible les écrit dans le .env de la VM ; ils ne sont pas stockés dans le dépôt.
deploy_app:
  stage: deploy
  image: registry.edu.forestier.re/infrastructure/images/ansible:v1.0.0
  variables:
    # Par défaut, si aucun hôte de l'inventaire ne correspond à "hosts:" du playbook,
    # Ansible affiche un simple avertissement et renvoie 0 : le job passe au vert sans
    # avoir rien déployé. Avec "error", ce cas fait échouer le pipeline.
    ANSIBLE_HOST_PATTERN_MISMATCH: "error"
  before_script:
    - echo "Déploiement sur ${USER_ID_UCA}.uca-devops.ovh"
    - get_secrets.sh > /tmp/secrets.json
    - command -v jq >/dev/null || apk add --no-cache jq >/dev/null || (apt-get update -qq && apt-get install -y -qq jq)
    # La clé SSH est stockée en base64 ; ssh exige une ligne vide finale et des droits 600.
    - SSH_KEY_B64=$(jq -er 'first(.. | .SSH_KEY? // empty)' /tmp/secrets.json)
    - echo "$SSH_KEY_B64" | base64 -d > /key
    - echo -e "\n" >> /key
    - chmod 600 /key
    - REGISTRY_TOKEN=$(jq -er 'first(.. | .REGISTRY_TOKEN? // empty)' /tmp/secrets.json)
    - MYSQL_HOST=$(jq -er 'first(.. | .MYSQL_HOST? // empty)' /tmp/secrets.json)
    - MYSQL_USERNAME=$(jq -er 'first(.. | .MYSQL_USERNAME? // empty)' /tmp/secrets.json)
    - MYSQL_PASSWORD=$(jq -er 'first(.. | .MYSQL_PASSWORD? // empty)' /tmp/secrets.json)
    - MYSQL_DATABASE_NAME=$(jq -er 'first(.. | .MYSQL_DATABASE_NAME? // empty)' /tmp/secrets.json)
    - GRAFANA_ADMIN_PASSWORD=$(jq -er 'first(.. | .GRAFANA_ADMIN_PASSWORD? // empty)' /tmp/secrets.json)
    - cd ansible
    - echo "vm_acnh ansible_host=${USER_ID_UCA}.uca-devops.ovh ansible_user=ubuntu" > inventory.ini
  script:
    - ansible-playbook -i inventory.ini deploy.yml --private-key /key -e "registry_token=$REGISTRY_TOKEN" -e "mysql_host=$MYSQL_HOST" -e "mysql_username=$MYSQL_USERNAME" -e "mysql_password=$MYSQL_PASSWORD" -e "mysql_database_name=$MYSQL_DATABASE_NAME" -e "grafana_admin_password=$GRAFANA_ADMIN_PASSWORD" -e "app_version=$CI_COMMIT_SHA" -e "user_id_uca=$USER_ID_UCA" -e "acme_email=$ACME_EMAIL" -e "registry_user=$CI_REGISTRY_USER" -e "project_namespace=$CI_PROJECT_NAMESPACE"
  only:
    - main
    - develop
    - tags

# Réinitialise la base avec le jeu de données de dump.sql.
# Le job supprime les tables avant l'import : il est manuel pour qu'un simple push
# n'efface jamais les données de production.
init_database:
  stage: deploy
  image: registry.edu.forestier.re/infrastructure/images/docker:v1.0.0
  before_script:
    - get_secrets.sh > /tmp/secrets.json
    - command -v jq >/dev/null || apk add --no-cache jq >/dev/null || (apt-get update -qq && apt-get install -y -qq jq)
    - MYSQL_HOST=$(jq -er 'first(.. | .MYSQL_HOST? // empty)' /tmp/secrets.json)
    - MYSQL_USERNAME=$(jq -er 'first(.. | .MYSQL_USERNAME? // empty)' /tmp/secrets.json)
    - MYSQL_PASSWORD=$(jq -er 'first(.. | .MYSQL_PASSWORD? // empty)' /tmp/secrets.json)
    - MYSQL_DATABASE_NAME=$(jq -er 'first(.. | .MYSQL_DATABASE_NAME? // empty)' /tmp/secrets.json)
  script:
    - echo "Importation des données initiales dans Clever Cloud..."
    - echo "SET FOREIGN_KEY_CHECKS=0; DROP TABLE IF EXISTS apiuser_art_collection, apiuser_flower_collection, apiuser_fossil_collection, apiuser_music_collection, apiflower_produces, apiart, apiflower, apifossil, apimusic, apiuser, apiserie, apiright; SET FOREIGN_KEY_CHECKS=1;" | docker run --rm -i mariadb:10.5 mariadb -h "$MYSQL_HOST" -u "$MYSQL_USERNAME" -p"$MYSQL_PASSWORD" "$MYSQL_DATABASE_NAME"
    - sed -e '/CREATE DATABASE/d' -e '/USE/d' app/backend/dump.sql | docker run --rm -i mariadb:10.5 mariadb -h "$MYSQL_HOST" -u "$MYSQL_USERNAME" -p"$MYSQL_PASSWORD" "$MYSQL_DATABASE_NAME"
    - echo "Importation terminée !"
  when: manual
  only:
    - main
    - develop

# Teste l'application depuis l'extérieur, comme un utilisateur : DNS, certificat HTTPS,
# routage Traefik et réponse de l'application. Une URL qui ne répond pas 200 fait échouer le pipeline.
verify_deploy:
  stage: verify
  image:
    name: curlimages/curl:8.10.1
    entrypoint: [""]
  script:
    - |
      for url in "https://${USER_ID_UCA}.uca-devops.ovh/" "https://api.${USER_ID_UCA}.uca-devops.ovh/arts" "https://grafana.${USER_ID_UCA}.uca-devops.ovh/api/health"; do
        ok=0
        for i in $(seq 1 10); do
          code=$(curl -s -o /dev/null -w "%{http_code}" "$url")
          echo "$url -> HTTP $code (essai $i/10)"
          if [ "$code" = "200" ]; then ok=1; break; fi
          sleep 10
        done
        if [ "$ok" != "1" ]; then
          echo "ECHEC : $url ne répond pas correctement"
          exit 1
        fi
      done
      echo "Toutes les vérifications sont OK"
  only:
    - main
    - develop
    - tags
